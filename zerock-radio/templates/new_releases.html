<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שירים ישראלים חדשים — ZeRock Radio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #0d0f14;
      --surface:     #161920;
      --surface2:    #1e2330;
      --border:      #2a2f3d;
      --accent:      #6c63ff;
      --accent-hov:  #5a52d8;
      --success:     #34d399;
      --success-hov: #2ab883;
      --text:        #e0e6f0;
      --text-dim:    #aab;
      --text-muted:  #788;
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", "Arial Hebrew", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    body { padding: 24px 16px 60px; }
    .container { max-width: 900px; margin: 0 auto; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 { font-size: 1.7rem; color: var(--accent); }
    .page-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
    .meta-bar { color: var(--text-muted); font-size: 0.85rem; }
    .meta-bar strong { color: var(--text-dim); }
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border-radius: 8px;
      border: 1px dashed var(--border);
    }
    .release {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .release-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .from { color: var(--success); font-weight: 600; font-size: 1rem; }
    .from-email { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; margin-inline-start: 6px; }
    .received { color: var(--text-muted); font-size: 0.85rem; white-space: nowrap; }
    .subject { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 12px; word-break: break-word; }
    .file {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
    .file + .file { margin-top: 8px; }
    .id3 { color: var(--success); font-size: 0.95rem; margin-bottom: 4px; }
    .id3 strong { font-weight: 700; }
    .file-name { color: var(--text); font-size: 0.95rem; margin-bottom: 4px; word-break: break-word; }
    .file-meta { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; }
    audio { width: 100%; margin: 8px 0 10px; display: block; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: 0;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-family: inherit;
      font-weight: 500;
    }
    .btn:hover { background: var(--accent-hov); }
    .btn-dl { background: var(--success); color: #000; font-weight: 600; }
    .btn-dl:hover { background: var(--success-hov); }
    .link-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .btn-link { background: var(--surface2, #1a1d27); color: var(--text); border: 1px solid var(--accent); }
    .btn-link:hover { background: var(--accent); color: #fff; }
    .too-big { color: var(--text-muted); font-size: 0.82rem; margin: 8px 0 0; }
    .help-tip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .help-tip code {
      background: var(--surface2);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--success);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.85em;
    }
    .refresh-row { display: flex; align-items: center; gap: 12px; }
    .refresh-btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .refresh-btn:disabled { opacity: 0.5; cursor: wait; }
    .search-row {
      margin-bottom: 16px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 10px 40px 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      inset-inline-end: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1rem;
    }
    .search-count { color: var(--text-muted); font-size: 0.82rem; margin-top: 6px; }
    .body-details {
      margin: 10px 0 4px;
      border-radius: 6px;
      overflow: hidden;
    }
    .body-details summary {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 4px 0;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .body-details summary::-webkit-details-marker { display: none; }
    .body-details summary::before {
      content: '▶';
      font-size: 0.65rem;
      transition: transform 0.15s;
      display: inline-block;
    }
    .body-details[open] summary::before { transform: rotate(90deg); }
    .body-details summary:hover { color: var(--text-dim); }
    .body-text {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 6px;
      color: var(--text-dim);
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow-y: auto;
    }
    .doc-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .doc-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .doc-link:hover { border-color: var(--accent); color: var(--accent); }
    .doc-icon { font-size: 1rem; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="container">

  <header class="page-header">
    <div>
      <h1>שירים ישראלים חדשים</h1>
      <div class="subtitle">שירים שנשלחו אלינו ל-rockzerock@gmail.com</div>
    </div>
    <div class="refresh-row">
      <span class="meta-bar" id="metaBar"></span>
      <button class="refresh-btn" id="refreshBtn" type="button">רענון ↻</button>
    </div>
  </header>

  <div class="search-row">
    <input class="search-input" id="searchInput" type="search" placeholder="חיפוש לפי אמן, שם שיר, שולח…" autocomplete="off" dir="rtl">
    <span class="search-icon">🔍</span>
    <div class="search-count" id="searchCount"></div>
  </div>

  <div class="help-tip">
    אמנים שולחים את השיר החדש שלהם ל-<code>rockzerock@gmail.com</code> — כקובץ MP3/WAV/FLAC או כקישור (Drive, WeTransfer, Spotify, YouTube ועוד).
    קבצים מופיעים כאן תוך 5 דקות עם נגן והורדה כ-MP3, קישורים מופיעים ככפתורים. הכול נשמר למשך 90 יום.
  </div>

  <div id="list">
    <div class="empty">טוען…</div>
  </div>

</div>

<script>
function fmtDur(sec) {
  if (!sec || sec < 1) return '';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function fmtSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}
function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleString('he-IL', {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch (e) { return iso; }
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function docIcon(ct, name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ct.startsWith('image/') || ['jpg','jpeg','png','gif','webp'].includes(ext)) return '🖼';
  if (ct === 'application/pdf' || ext === 'pdf') return '📄';
  if (['doc','docx','rtf'].includes(ext)) return '📝';
  return '📎';
}

let _loading = false;
let _allReleases = [];

function hayOf(r) {
  return [
    r.from_name, r.from_email, r.subject,
    ...(r.links || []).map(l => l.label),
    ...(r.files || []).flatMap(f => [f.artist, f.title, f.filename])
  ].join(' ').toLowerCase();
}

function releaseCard(r) {
  return `
    <div class="release" data-id="${escapeHtml(r.id)}" data-hay="${escapeHtml(hayOf(r))}">
      <div class="release-header">
        <div class="from">
          ${escapeHtml(r.from_name) || escapeHtml(r.from_email)}
          ${r.from_name ? `<span class="from-email">&lt;${escapeHtml(r.from_email)}&gt;</span>` : ''}
        </div>
        <div class="received">${fmtDate(r.received_at)}</div>
      </div>
      ${r.subject ? `<div class="subject">${escapeHtml(r.subject)}</div>` : ''}
      ${(r.body_text || '').trim() ? `
        <details class="body-details">
          <summary>על השיר</summary>
          <div class="body-text">${escapeHtml((r.body_text || '').trim())}</div>
        </details>` : ''}
      ${(r.links || []).length ? `
        <div class="link-list">
          ${r.links.map(l => `
            <a class="btn btn-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">🔗 ${escapeHtml(l.label || 'קישור')}</a>
          `).join('')}
        </div>` : ''}
      ${(r.too_big || []).length ? `
        <div class="too-big">⚠ הקובץ (${escapeHtml(r.too_big.join(', '))}) גדול מדי להעלאה אוטומטית — הוא נשלח במייל.</div>` : ''}
      ${(r.docs || []).length ? `
        <div class="doc-list">
          ${(r.docs || []).map(d => `
            <a class="doc-link" href="${d.doc_url}" download>
              <span class="doc-icon">${docIcon(d.content_type || '', d.filename || '')}</span>
              ${escapeHtml(d.filename)}
            </a>
          `).join('')}
        </div>` : ''}
      ${(r.files || []).map(f => `
        <div class="file">
          ${(f.artist || f.title) ? `
            <div class="id3">
              ${f.artist ? `<strong>${escapeHtml(f.artist)}</strong>` : ''}
              ${(f.artist && f.title) ? ' — ' : ''}
              ${f.title ? escapeHtml(f.title) : ''}
            </div>` : ''}
          <div class="file-name">${escapeHtml(f.filename)}</div>
          <div class="file-meta">
            ${fmtSize(f.size)}${f.duration ? ' · ' + fmtDur(f.duration) : ''}
          </div>
          <audio controls preload="none" src="${f.play_url}"></audio>
          <div class="actions">
            <a class="btn btn-dl" href="${f.download_url}">⬇ הורד MP3</a>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// Reconcile the list with the latest data WITHOUT rebuilding cards that stay.
// (The old code replaced the whole list's innerHTML every minute and on every
// keystroke in the search box, which destroyed the <audio> element that was
// playing — so a song cut off after at most ~60 seconds.)
function syncList() {
  const list = document.getElementById('list');
  list.querySelectorAll(':scope > .empty').forEach(el => el.remove());
  const have = new Map([...list.querySelectorAll(':scope > .release[data-id]')]
                         .map(el => [el.dataset.id, el]));
  const wanted = new Set(_allReleases.map(r => r.id));
  have.forEach((el, id) => { if (!wanted.has(id)) el.remove(); });
  let prev = null;
  for (const r of _allReleases) {
    let el = have.get(r.id);
    if (!el) {
      const tpl = document.createElement('template');
      tpl.innerHTML = releaseCard(r).trim();
      el = tpl.content.firstElementChild;
      if (prev) prev.after(el); else list.prepend(el);
    }
    prev = el;
  }
}

// Search only shows/hides existing cards — it never rebuilds them.
function applyFilter() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const countEl = document.getElementById('searchCount');
  const list = document.getElementById('list');
  const cards = [...list.querySelectorAll(':scope > .release')];
  let shown = 0, files = 0;
  for (const el of cards) {
    const match = !q || (el.dataset.hay || '').includes(q);
    el.style.display = match ? '' : 'none';
    if (match) { shown++; files += el.querySelectorAll('audio').length; }
  }
  let none = document.getElementById('noResults');
  if (!none) {
    none = document.createElement('div');
    none.id = 'noResults';
    none.className = 'empty';
    list.after(none);
  }
  if (cards.length && !shown) {
    none.innerHTML = `לא נמצאו תוצאות עבור "<strong>${escapeHtml(q)}</strong>"`;
    none.style.display = '';
  } else {
    none.style.display = 'none';
  }
  countEl.textContent = q && shown
    ? `${shown} אימיילים, ${files} שירים (מתוך ${cards.length})`
    : '';
}

async function load() {
  if (_loading) return;
  _loading = true;
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/new-releases', { headers: { 'Cache-Control': 'no-cache' } });
    const data = await r.json();
    _allReleases = data;
    const meta = document.getElementById('metaBar');
    const total = data.length;
    const totalFiles = data.reduce((s, r) => s + (r.files || []).length, 0);
    const totalLinks = data.filter(r => !(r.files || []).length && (r.links || []).length).length;
    meta.innerHTML = total
      ? `<strong>${total}</strong> אימיילים, <strong>${totalFiles}</strong> שירים` +
        (totalLinks ? `, <strong>${totalLinks}</strong> עם קישורים בלבד` : '')
      : '';
    if (!total) {
      document.getElementById('list').innerHTML = `<div class="empty">
        עוד לא הגיעו שירים חדשים.<br>
        שלחו ל-<strong>rockzerock@gmail.com</strong> והם יופיעו כאן תוך 5 דקות.
      </div>`;
      return;
    }
    syncList();
    applyFilter();
  } catch (e) {
    // keep whatever is on screen (and playing) if a refresh fails
    if (!document.querySelector('#list .release')) {
      document.getElementById('list').innerHTML =
        '<div class="empty">שגיאה בטעינת הרשימה</div>';
    }
    console.error(e);
  } finally {
    _loading = false;
    btn.disabled = false;
  }
}

document.getElementById('searchInput').addEventListener('input', applyFilter);

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'בודק…';
  try {
    // Trigger an immediate IMAP poll so the page reflects newest emails right away
    await fetch('/api/new-releases/poll-now', { method: 'POST' });
  } catch (e) {}
  btn.textContent = 'רענון ↻';
  await load();
});

load();
setInterval(load, 60000); // soft refresh once a minute — safe now: playing songs are never touched
</script>
</body>
</html>
