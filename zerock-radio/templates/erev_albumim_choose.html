<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ערב של אלבומים — בחירת אלבומים</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#141414;color:#f0f0f0;min-height:100vh;padding:32px 16px}
    .card{max-width:560px;margin:0 auto;background:#1d1d1d;border:1px solid #333;border-radius:14px;padding:26px}
    h1{font-size:1.5rem;color:#c084fc;margin-bottom:6px;text-align:center}
    .sub{text-align:center;color:#aaa;font-size:.95rem;margin-bottom:20px}
    .sub strong{color:#f0f0f0}
    label{display:block;margin:18px 0 8px;font-weight:bold}
    .hint{color:#888;font-size:.82rem;font-weight:normal}
    textarea{width:100%;min-height:220px;background:#111;color:#f0f0f0;border:1px solid #444;border-radius:10px;
             padding:12px;font-size:1rem;line-height:1.9;resize:vertical;font-family:inherit}
    button{width:100%;margin-top:20px;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:10px;
           font-size:1.1rem;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    .msg{margin-top:16px;text-align:center;font-size:1rem;display:none}
    .msg.ok{color:#4ade80;display:block}
    .msg.err{color:#f87171;display:block}
  </style>
</head>
<body>
  <div class="card">
    <h1>🎶 ערב של אלבומים</h1>
    <div class="sub">שלום <strong>{{ name }}</strong>,<br>הערב שלך: <strong>{{ date_disp }}</strong></div>
    <label>בחר/י את האלבומים להשמעה
      <div class="hint">אלבום אחד בכל שורה · פורמט: אמן – שם האלבום (לדוגמה: Pink Floyd – The Wall)</div>
    </label>
    <textarea id="albums" placeholder="Pink Floyd – The Wall&#10;Nirvana – Nevermind&#10;...">{{ albums }}</textarea>
    <button id="save" onclick="save()">שמירת האלבומים</button>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    function save(){
      var btn=document.getElementById('save'), msg=document.getElementById('msg');
      btn.disabled=true; msg.className='msg'; msg.textContent='';
      fetch('/api/erev-albumim/choose/{{ token }}',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({albums:document.getElementById('albums').value})
      }).then(function(r){return r.json();})
        .then(function(d){
          if(d.ok){msg.className='msg ok';msg.textContent='✓ נשמרו '+d.count+' אלבומים. תודה!';}
          else{msg.className='msg err';msg.textContent='שגיאה: '+(d.error||'נסה/י שוב');btn.disabled=false;}
        }).catch(function(){msg.className='msg err';msg.textContent='שגיאה בשמירה. נסה/י שוב.';btn.disabled=false;});
    }
  </script>
</body>
</html>
